services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      YOMUYOMU_SITE_ADDRESS: ${YOMUYOMU_SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - nlp

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yomuyomu}
      POSTGRES_USER: ${POSTGRES_USER:-yomuyomu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yomuyomu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nlp:
    build:
      context: .
      dockerfile: infra/docker/nlp.Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: Yomuyomu NLP
      APP_VERSION: 0.1.0
      API_CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost}
      JLPT_MAP_PATH: /app/services/nlp/data/jlpt_map.csv
      FREQUENCY_MAP_PATH: /app/services/nlp/data/frequency_map.csv
      JMDICT_DB_PATH: /app/services/nlp/data/jmdict.sqlite
      LOOKUP_SEED_PATH: /app/services/nlp/data/lookup_seed.json
      ALLOW_SEED_FALLBACK: ${ALLOW_SEED_FALLBACK:-true}
    volumes:
      - ./services/nlp/data:/app/services/nlp/data:ro

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: Yomuyomu API
      APP_VERSION: 0.1.0
      API_CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-yomuyomu}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-yomuyomu}
      REDIS_URL: redis://redis:6379/0
      NLP_SERVICE_URL: http://nlp:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      AI_PROMPT_VERSION: ${AI_PROMPT_VERSION:-v2}
      AI_CACHE_TTL_SECONDS: ${AI_CACHE_TTL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: infra/docker/web.prod.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
        NEXT_PUBLIC_NLP_BASE_URL: ${NEXT_PUBLIC_NLP_BASE_URL:-/nlp}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
      NEXT_PUBLIC_NLP_BASE_URL: ${NEXT_PUBLIC_NLP_BASE_URL:-/nlp}
    depends_on:
      - api
      - nlp

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
